spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5442}/${DB_NAME:identity_db}
    username: ${DB_USER:identity_user}
    password: ${DB_PASSWORD:identity_pass}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

app:
  jwt:
    issuer: ${JWT_ISSUER:identity-service}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email:    ${ADMIN_EMAIL:admin@hospital.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    nombre:   ${ADMIN_NOMBRE:Administrador del Sistema}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.grupo10.identity: DEBUG
    org.springframework.security: INFO
